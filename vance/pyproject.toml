    "elevenlabs>=2.24.0",
    "fastapi>=0.121.3",
    "firebase-admin>=7.1.0",
    "google-auth>=2.43.0",
    "google-genai>=1.52.0",
    "groq>=0.36.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "load-dotenv>=0.1.0",
    "loguru>=0.7.3",
    "mistralai>=1.9.11",
    "numpy>=2.3.5",
    "openai>=2.8.1",
    "openpyxl>=3.1.5",
    "pendulum>=3.1.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.12.4",
    "pydantic-ai>=1.22.0",
    "pydantic-settings>=2.12.0",
    "pytest>=9.0.1",
